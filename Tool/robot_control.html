<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pleiades 机器人遥控</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    background: #0d1117;
    color: #c9d1d9;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh;
}
.container {
    width: 400px;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 24px;
}
h1 { font-size: 18px; text-align: center; margin-bottom: 20px; color: #58a6ff; }

/* 连接栏 */
.conn-bar {
    display: flex; gap: 8px; margin-bottom: 20px;
    align-items: center;
}
.conn-bar input {
    background: #0d1117; border: 1px solid #30363d;
    color: #c9d1d9; padding: 8px 10px; border-radius: 6px;
    font-size: 14px;
}
.conn-bar input.ip { flex: 2; }
.conn-bar input.port { flex: 1; }
.conn-bar button {
    background: #238636; border: none; color: white;
    padding: 8px 16px; border-radius: 6px; cursor: pointer;
    font-size: 14px; font-weight: 600;
}
.conn-bar button:hover { background: #2ea043; }
.conn-bar button.disconnect { background: #da3633; }
.conn-bar button.disconnect:hover { background: #f85149; }
.status {
    font-size: 12px; margin-bottom: 16px; text-align: center;
}
.status .dot {
    display: inline-block; width: 8px; height: 8px;
    border-radius: 50%; margin-right: 4px;
}
.dot.on { background: #3fb950; }
.dot.off { background: #f85149; }

/* 模式切换 */
.mode-row {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 16px; padding: 10px 12px;
    background: #0d1117; border: 1px solid #30363d;
    border-radius: 8px; font-size: 14px;
}
.mode-row .label { color: #8b949e; }
.mode-toggle {
    display: flex; border-radius: 6px; overflow: hidden;
    border: 1px solid #30363d;
}
.mode-toggle button {
    background: #21262d; border: none; color: #8b949e;
    padding: 6px 16px; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: background 0.15s, color 0.15s;
}
.mode-toggle button.active {
    background: #1f6feb; color: white;
}

/* 方向键 */
.dpad {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: 1fr 1fr 1fr;
    gap: 8px;
    width: 240px; height: 240px;
    margin: 0 auto 20px;
}
.btn {
    background: #21262d; border: 2px solid #30363d;
    border-radius: 10px; color: #c9d1d9;
    font-size: 24px; font-weight: bold;
    cursor: pointer; user-select: none;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.1s, border-color 0.1s;
    -webkit-tap-highlight-color: transparent;
}
.btn:active, .btn.pressed {
    background: #1f6feb; border-color: #58a6ff; color: white;
}
.btn-disabled { opacity: 0.35; pointer-events: none; }
.btn-w { grid-column: 2; grid-row: 1; }
.btn-a { grid-column: 1; grid-row: 2; }
.btn-s { grid-column: 2; grid-row: 2; }
.btn-d { grid-column: 3; grid-row: 2; }
.btn-stop { grid-column: 2; grid-row: 3; font-size: 14px; }

/* 蜂鸣按钮 */
.beep-row { text-align: center; margin-bottom: 16px; }
.btn-beep {
    background: #21262d; border: 1px solid #30363d;
    color: #c9d1d9; padding: 8px 24px; border-radius: 6px;
    cursor: pointer; font-size: 14px;
}
.btn-beep:hover { background: #30363d; }

/* Goto */
.goto-row {
    display: flex; gap: 8px; margin-bottom: 16px;
    align-items: center; font-size: 13px;
}
.goto-row input {
    background: #0d1117; border: 1px solid #30363d;
    color: #c9d1d9; padding: 6px 8px; border-radius: 6px;
    width: 70px; font-size: 13px; text-align: center;
}
.goto-row .goto-label { color: #8b949e; }
.goto-row button {
    background: #1f6feb; border: none; color: white;
    padding: 6px 12px; border-radius: 6px; cursor: pointer;
    font-size: 13px; font-weight: 600;
}
.goto-row button:hover { background: #388bfd; }

/* 遥测 */
.telemetry {
    background: #0d1117; border: 1px solid #30363d;
    border-radius: 8px; padding: 12px; font-size: 13px;
    line-height: 1.8;
}
.telemetry span { color: #8b949e; }
.telemetry .val { color: #7ee787; margin-left: 4px; }

/* 提示 */
.hint {
    font-size: 11px; color: #484f58; text-align: center; margin-top: 16px;
}
</style>
</head>
<body>

<div class="container">
    <h1>🚗 Pleiades 机器人遥控</h1>

    <div class="conn-bar">
        <input class="ip" id="ip" type="text" value="192.168.4.1" placeholder="小车 IP">
        <input class="port" id="port" type="number" value="9090" placeholder="端口">
        <button id="connBtn" onclick="toggleConnect()">连接</button>
    </div>

    <div class="status">
        <span id="statusDot" class="dot off"></span>
        <span id="statusText">未连接</span>
    </div>

    <!-- 模式切换 -->
    <div class="mode-row">
        <span class="label">模式:</span>
        <div class="mode-toggle" id="modeToggle">
            <button id="btnManual" class="active" onclick="setMode('manual')">Manual</button>
            <button id="btnAuto" onclick="setMode('auto')">Auto</button>
        </div>
    </div>

    <div class="dpad" id="dpad">
        <button class="btn btn-w" id="btnW"
            onmousedown="press('forward')" onmouseup="release()" onmouseleave="release()"
            ontouchstart="press('forward');event.preventDefault()" ontouchend="release()">W</button>
        <button class="btn btn-a" id="btnA"
            onmousedown="press('spin_left')" onmouseup="release()" onmouseleave="release()"
            ontouchstart="press('spin_left');event.preventDefault()" ontouchend="release()">A</button>
        <button class="btn btn-s" id="btnS"
            onmousedown="press('backward')" onmouseup="release()" onmouseleave="release()"
            ontouchstart="press('backward');event.preventDefault()" ontouchend="release()">S</button>
        <button class="btn btn-d" id="btnD"
            onmousedown="press('spin_right')" onmouseup="release()" onmouseleave="release()"
            ontouchstart="press('spin_right');event.preventDefault()" ontouchend="release()">D</button>
        <button class="btn btn-stop" onclick="sendManual('stop')">停</button>
    </div>

    <div class="beep-row">
        <button class="btn-beep" onclick="sendManual('beep',{ms:200})">🔊 蜂鸣</button>
    </div>

    <!-- Goto -->
    <div class="goto-row" id="gotoRow">
        <span class="goto-label">Goto:</span>
        <span style="color:#8b949e">X</span>
        <input id="gotoX" type="number" value="1.0" step="0.1" placeholder="X(m)">
        <span style="color:#8b949e">Y</span>
        <input id="gotoY" type="number" value="1.0" step="0.1" placeholder="Y(m)">
        <button onclick="sendGoto()">出发</button>
    </div>

    <div class="telemetry" id="telemetry">
        <div><span>位置:</span><span class="val" id="tpos">--</span></div>
        <div><span>朝向:</span><span class="val" id="tyaw">--</span>°</div>
        <div><span>速度:</span><span class="val" id="tvel">--</span></div>
    </div>

    <div class="hint">
        W前进 / S后退 / A左旋 / D右旋<br>
        按住移动，松手即停 | Manual 模式下手动控制<br>
        Auto 模式下使用 Goto 任务 | 键盘和按钮均可操作
    </div>
</div>

<script>
let ws = null;
let currentMode = 'manual';  // 当前模式

// ── 键盘事件 ──────────────────────────────────
const keyMap = {
    'w': 'forward', 'W': 'forward',
    's': 'backward', 'S': 'backward',
    'a': 'spin_left', 'A': 'spin_left',
    'd': 'spin_right', 'D': 'spin_right',
    'b': 'beep', 'B': 'beep',
};
const keyButtons = {
    'w': 'btnW', 'W': 'btnW',
    's': 'btnS', 'S': 'btnS',
    'a': 'btnA', 'A': 'btnA',
    'd': 'btnD', 'D': 'btnD',
};

document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    const cmd = keyMap[e.key];
    if (cmd) {
        e.preventDefault();
        if (cmd === 'beep') { sendManual(cmd, {ms: 200}); return; }
        if (currentMode !== 'manual') return;
        press(cmd);
    }
});
document.addEventListener('keyup', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (keyMap[e.key]) { e.preventDefault(); release(); }
});

// ── 连接 ──────────────────────────────────────
function toggleConnect() {
    if (ws && ws.readyState === WebSocket.OPEN) {
        ws.close();
    } else {
        connect();
    }
}

function connect() {
    if (ws && ws.readyState === WebSocket.CONNECTING) return;
    const ip = document.getElementById('ip').value.trim();
    const port = document.getElementById('port').value.trim();
    const url = 'ws://' + ip + ':' + port;
    ws = new WebSocket(url);

    ws.onopen = () => {
        setStatus(true, '已连接');
        document.getElementById('connBtn').textContent = '断开';
        document.getElementById('connBtn').classList.add('disconnect');
    };
    ws.onclose = () => {
        setStatus(false, '已断开');
        document.getElementById('connBtn').textContent = '连接';
        document.getElementById('connBtn').classList.remove('disconnect');
        ws = null;
    };
    ws.onerror = () => setStatus(false, '连接错误');
    ws.onmessage = (e) => {
        try {
            const data = JSON.parse(e.data);
            if (data.type === 'pose') {
                updateTelemetry(data);
            }
        } catch (_) {}
    };
}

function setStatus(on, text) {
    document.getElementById('statusText').textContent = text;
    const dot = document.getElementById('statusDot');
    dot.className = 'dot ' + (on ? 'on' : 'off');
}

// ── 模式切换 ──────────────────────────────────
function setMode(mode) {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    currentMode = mode;

    // 按钮高亮
    document.getElementById('btnManual').classList.toggle('active', mode === 'manual');
    document.getElementById('btnAuto').classList.toggle('active', mode === 'auto');

    // 方向键：Manual 可用，Auto 禁用
    const btns = ['btnW','btnA','btnS','btnD'];
    btns.forEach(id => {
        document.getElementById(id).classList.toggle('btn-disabled', mode !== 'manual');
    });

    // 发模式切换命令
    const action = mode === 'auto' ? 'switch_to_auto' : 'switch_to_manual';
    ws.send(JSON.stringify({ cmd: 'mode', action: action }));
}

// ── 手动命令 ──────────────────────────────────
function sendManual(action, extra) {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    if (currentMode !== 'manual') return;
    const msg = { cmd: 'manual', action: action };
    if (extra) Object.assign(msg, extra);
    ws.send(JSON.stringify(msg));
}

// ── Goto 命令 ──────────────────────────────────
function sendGoto() {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    if (currentMode !== 'auto') return;
    const x = parseFloat(document.getElementById('gotoX').value);
    const y = parseFloat(document.getElementById('gotoY').value);
    if (isNaN(x) || isNaN(y)) return;
    ws.send(JSON.stringify({
        cmd: 'auto',
        action: 'push',
        missions: [{ type: 'goto', x: x, y: y }]
    }));
}

// ── 按钮交互 ──────────────────────────────────
let activeCmd = null;

function press(cmd) {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    if (currentMode !== 'manual') return;
    if (activeCmd === cmd) return;
    activeCmd = cmd;
    sendManual(cmd);
    highlightButton(cmd, true);
}

function release() {
    if (!activeCmd) return;
    sendManual('stop');
    highlightButton(activeCmd, false);
    activeCmd = null;
}

function highlightButton(cmd, on) {
    const id = keyButtons[cmd];
    if (id) {
        const btn = document.getElementById(id);
        if (btn) btn.classList.toggle('pressed', on);
    }
}

// ── 遥测 ──────────────────────────────────────
function updateTelemetry(d) {
    if (d.x !== undefined) document.getElementById('tpos').textContent =
        '(' + d.x.toFixed(1) + ', ' + d.y.toFixed(1) + ')';
    if (d.yaw !== undefined) document.getElementById('tyaw').textContent =
        (d.yaw * 57.3).toFixed(0);
    if (d.vx !== undefined) {
        const speed = Math.sqrt(d.vx * d.vx + d.vy * d.vy);
        document.getElementById('tvel').textContent = speed.toFixed(2) + ' m/s';
    }
}
</script>

</body>
</html>
