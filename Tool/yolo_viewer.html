<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>YOLO 多车检测查看器</title>
<style>
  body { margin: 0; padding: 12px; background: #111; color: #eee; font-family: sans-serif; }
  #controls { margin-bottom: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #controls input { padding: 6px; background: #222; color: #eee; border: 1px solid #444; border-radius: 4px; width: 130px; }
  #controls button { padding: 6px 16px; cursor: pointer; background: #2563eb; color: #fff; border: none; border-radius: 4px; }
  #panels { display: flex; gap: 12px; flex-wrap: wrap; }
  .panel { flex: 1; min-width: 320px; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; overflow: hidden; }
  .panel .head { padding: 6px 10px; background: #222; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; }
  .panel .status { color: #9ca3af; }
  .panel .close { cursor: pointer; background: #b91c1c; color: #fff; border: none; border-radius: 4px; padding: 2px 8px; }
  .panel canvas { width: 100%; display: block; }
</style>
</head>
<body>
<div id="controls">
  <input id="ip" placeholder="车 IP（如 127.0.0.1）">
  <input id="port" placeholder="端口" value="9010">
  <button onclick="connect()">连接</button>
</div>
<div id="panels"></div>
<script>
const socks = {};
let nextId = 1;

// 只画 person 的框：服务端仍推全部类别（协议不变），这里只过滤**显示**。
// 想看全部类别把这一行改成 false 即可。
const ONLY_PERSON = true;

function connect() {
  const ip = document.getElementById("ip").value.trim();
  const port = document.getElementById("port").value.trim() || "9010";
  if (!ip) { alert("请先填 IP"); return; }

  const idx = nextId++;
  const panel = document.createElement("div");
  panel.className = "panel";
  panel.innerHTML = `
    <div class="head">
      <span>车 ${idx}（${ip}:${port}）</span>
      <span class="status" id="st${idx}">连接中…</span>
      <button class="close" onclick="disconnect(${idx})">断开</button>
    </div>
    <canvas id="cv${idx}"></canvas>
  `;
  document.getElementById("panels").appendChild(panel);

  const cv = document.getElementById("cv" + idx);
  const ctx = cv.getContext("2d");
  const stEl = document.getElementById("st" + idx);

  const ws = new WebSocket("ws://" + ip + ":" + port + "/ws");
  ws.binaryType = "arraybuffer";
  socks[idx] = ws;

  ws.onopen = () => { console.log("车" + idx + " 已连接"); stEl.textContent = "已连接"; };
  ws.onerror = () => { stEl.textContent = "连接失败"; };
  ws.onclose = () => { if (socks[idx] === ws) stEl.textContent = "断开"; };

  ws.onmessage = async (ev) => {
    // 拆包
    const buf = ev.data;
    const view = new DataView(buf);
    const headerLen = view.getUint32(0, true);
    const header = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 4, headerLen)));
    const jpeg = new Uint8Array(buf, 4 + headerLen);

    const blob = new Blob([jpeg], { type: "image/jpeg" });
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      cv.width = img.width;
      cv.height = img.height;
      ctx.drawImage(img, 0, 0);
      // 画框（坐标为原图像素坐标）：只画 person，其余类别跳过
      // 线宽/字号按画面宽度缩放：640 宽 → 5 px 线宽、18 px 字，缩放到面板宽后依然醒目
      const lw = Math.max(3, Math.round(cv.width / 128));
      for (const d of header.dets) {
        if (ONLY_PERSON && d.class_name !== "person") continue;
        const w = d.xmax - d.xmin;
        const h = d.ymax - d.ymin;
        // ① 深色外描边：亮背景上也糊不掉
        ctx.lineWidth = lw + 4;
        ctx.strokeStyle = "rgba(0,0,0,0.80)";
        ctx.strokeRect(d.xmin, d.ymin, w, h);
        // ② 亮绿主线 + 发光
        ctx.lineWidth = lw;
        ctx.strokeStyle = "#22ff88";
        ctx.shadowColor = "rgba(34,255,136,0.95)";
        ctx.shadowBlur = 10;
        ctx.strokeRect(d.xmin, d.ymin, w, h);
        ctx.shadowBlur = 0;
        // ③ 标签：深底亮字，贴在框上方；框贴到画面顶时改贴框内
        const fs = Math.max(13, Math.round(cv.width / 36));
        ctx.font = "bold " + fs + "px sans-serif";
        const text = d.class_name;
        const pad = Math.round(fs * 0.35);
        const th = fs + pad * 2;
        const tx = d.xmin;
        const ty = d.ymin - th >= 0 ? d.ymin - th : d.ymin;
        ctx.fillStyle = "rgba(0,0,0,0.75)";
        ctx.fillRect(tx, ty, ctx.measureText(text).width + pad * 2, th);
        ctx.fillStyle = "#22ff88";
        ctx.fillText(text, tx + pad, ty + th - pad);
      }
    };
    img.src = url;
  };
}

function disconnect(idx) {
  if (socks[idx]) { try { socks[idx].close(); } catch (e) {} delete socks[idx]; }
  const cv = document.getElementById("cv" + idx);
  if (cv) { const p = cv.closest(".panel"); if (p) p.remove(); }
}
</script>
</body>
</html>
