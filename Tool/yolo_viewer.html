<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>YOLO 多车检测查看器</title>
<style>
  body { margin: 0; padding: 12px; background: #111; color: #eee; font-family: sans-serif; }
  #controls { margin-bottom: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #controls input { padding: 6px; background: #222; color: #eee; border: 1px solid #444; border-radius: 4px; width: 130px; }
  #controls button { padding: 6px 16px; cursor: pointer; background: #2563eb; color: #fff; border: none; border-radius: 4px; }
  #panels { display: flex; gap: 12px; flex-wrap: wrap; }
  .panel { flex: 1; min-width: 320px; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; overflow: hidden; }
  .panel .head { padding: 6px 10px; background: #222; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; }
  .panel .fps { color: #4ade80; font-weight: bold; }
  .panel .close { cursor: pointer; background: #b91c1c; color: #fff; border: none; border-radius: 4px; padding: 2px 8px; }
  .panel canvas { width: 100%; display: block; }
</style>
</head>
<body>
<div id="controls">
  <input id="ip" placeholder="车 IP（如 127.0.0.1）">
  <input id="port" placeholder="端口" value="9010">
  <button onclick="connect()">连接</button>
</div>
<div id="panels"></div>
<script>
const socks = {};
let nextId = 1;

function connect() {
  const ip = document.getElementById("ip").value.trim();
  const port = document.getElementById("port").value.trim() || "9010";
  if (!ip) { alert("请先填 IP"); return; }

  const idx = nextId++;
  const panel = document.createElement("div");
  panel.className = "panel";
  panel.innerHTML = `
    <div class="head">
      <span>车 ${idx}（${ip}:${port}）</span>
      <span class="fps" id="fps${idx}">-</span>
      <button class="close" onclick="disconnect(${idx})">断开</button>
    </div>
    <canvas id="cv${idx}"></canvas>
  `;
  document.getElementById("panels").appendChild(panel);

  const cv = document.getElementById("cv" + idx);
  const ctx = cv.getContext("2d");
  const fpsEl = document.getElementById("fps" + idx);
  let last = 0;

  const ws = new WebSocket("ws://" + ip + ":" + port + "/ws");
  ws.binaryType = "arraybuffer";
  socks[idx] = ws;

  ws.onopen = () => { console.log("车" + idx + " 已连接"); };
  ws.onerror = () => { fpsEl.textContent = "连接失败"; };
  ws.onclose = () => { if (socks[idx] === ws) fpsEl.textContent = "断开"; };

  ws.onmessage = async (ev) => {
    // 拆包：[4B header_len LE][header JSON {dets:[...]}][JPEG]
    const buf = ev.data;
    const view = new DataView(buf);
    const headerLen = view.getUint32(0, true);
    const header = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 4, headerLen)));
    const jpeg = new Uint8Array(buf, 4 + headerLen);

    const blob = new Blob([jpeg], { type: "image/jpeg" });
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      cv.width = img.width;
      cv.height = img.height;
      ctx.drawImage(img, 0, 0);
      // 画框（坐标为原图像素坐标）
      ctx.strokeStyle = "#4ade80";
      ctx.lineWidth = 2;
      ctx.fillStyle = "#4ade80";
      ctx.font = "14px sans-serif";
      for (const d of header.dets) {
        ctx.strokeRect(d.xmin, d.ymin, d.xmax - d.xmin, d.ymax - d.ymin);
        ctx.fillText(d.class_name, d.xmin, Math.max(14, d.ymin - 4));
      }
      // FPS（浏览器端差分）
      const now = performance.now();
      if (last > 0) {
        fpsEl.textContent = (1000 / (now - last)).toFixed(1) + " FPS";
      }
      last = now;
    };
    img.src = url;
  };
}

function disconnect(idx) {
  if (socks[idx]) { try { socks[idx].close(); } catch (e) {} delete socks[idx]; }
  const cv = document.getElementById("cv" + idx);
  if (cv) { const p = cv.closest(".panel"); if (p) p.remove(); }
}
</script>
</body>
</html>
