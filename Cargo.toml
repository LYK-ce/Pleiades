#Date: 2026-03-12

[package]
name = "Pleiades"
version = "0.1.0"
edition = "2021"

[lib]
name = "pleiades"
path = "Src/lib.rs"

[[bin]]
name = "Pleiades"
path = "Src/main.rs"

[features]
default = ["cuda"]
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]

[dependencies]
# 配置文件解析
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 日志系统
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# 日期时间
chrono = "0.4"

# P2P网络
libp2p = { version = "0.56", features = [
    "tokio",
    "tcp",
    "noise",
    "yamux",
    "mdns",
    "kad",
    "request-response",
    "macros",
    "ping"
]}

# 异步运行时
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
futures = "0.3"

# HTTP API (OpenAI 兼容)
axum = { version = "0.7", features = ["json", "macros"] }
async-stream = "0.3"

# 序列化 (网络协议)
bincode = "1.3"

# 异步trait支持
async-trait = "0.1"

# Candle ML框架 (GGUF推理)
candle-core = "0.10.2"
candle-nn = "0.10.2"
candle-transformers = "0.10.2"
anyhow = "1.0"

# 系统工具
num_cpus = "1.16"
thiserror = "1.0"   # 可选，用于简化错误定义

# TUI界面
ratatui = "0.30"
crossterm = "0.27"

# 配置文件编辑
toml_edit = "0.22"

# 分词器
shimmytok = "0.7"
# Jinja2 模板引擎 (GGUF chat_template 渲染)
minijinja = "2"
# P2P网络流
libp2p-stream = "0.4.0-alpha"

# 系统信息查询（Profile 内存）
sysinfo = "0.33"
nvml-wrapper = "0.11"

# Lua脚本引擎
mlua = { version = "0.12.0-rc.1", features = ["lua54", "vendored", "async"] }

# 存储模块所需
blake3 = "1.5"
sha2 = "0.10"
twox-hash = "1.6"
hex = "0.4"
tempfile = "3.10"

