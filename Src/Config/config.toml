# Pleiades 配置文件

[Log]
# 日志级别: trace, debug, info, warn, error
level = "info"

# 日志文件路径 (留空则输出到控制台)
log_file_path = "Log/"


[Network]

LAN = true
WAN = false

Transport_Protocol = "TCP" # TCP/QUIC

# 节点管理相关配置
cleanup_interval = 300  # 清理间隔（秒），默认300秒
timeout_interval = 300  # 超时间隔（秒），默认300秒
heartbeat_interval = 60  # 心跳间隔（秒），默认60秒
heartbeat_timeout = 10   # 心跳超时（秒），默认10秒
request_response_timeout = 300  # Request-Response 协议超时（秒），默认300秒


[Runtime]
# 运行时环境相关的配置
device = "cpu"
model_path = ""  # 请填写您的 GGUF 模型路径


# 推理相关的配置
max_token  = 128
temperature = 0.8
seed = 299792458


[Storage]
# 工作目录（所有运行时数据的根目录）
workspace_dir = "Pleiades_Workspace"
# 存储配额（单位：GB），0 表示不限制
quota_gb = 0


[Scheduler]
# 调度策略: uniform / weighted
strategy = "uniform"


[Session]
# 最大并发对话槽位数
max_slots = 4

[Identity]
# 节点名称（不含 #XXXX 后缀）
peer_name = "new_peer"
