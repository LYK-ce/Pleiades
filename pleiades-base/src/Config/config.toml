# Pleiades 配置文件（树莓派实例：STM32=/dev/ttyUSB0，雷达=/dev/ttyUSB1）
#
# 注意：运行时读取的是「运行目录/.config/config.toml」，本文件是仓库内的实例配置，
# 拉取后执行：  mkdir -p .config && cp Src/Config/config.toml .config/config.toml

[Log]
level = "info"
log_file_path = "Log/"

[Network]
LAN = true
WAN = false
Transport_Protocol = "TCP"
cleanup_interval = 300
timeout_interval = 300
heartbeat_interval = 60
heartbeat_timeout = 10
request_response_timeout = 300

[Storage]
workspace_dir = "Pleiades_Workspace"
quota_gb = 0
kvcache_dir = ".kvcache"

[Identity]
# 车名 = peer_name，多车时每辆必须唯一（树莓派用 robot-pi，Jetson 请另改）
peer_name = "robot-pi"

[Robot]
obstacle_inflation_radius = 0.2 # 他车障碍膨胀半径（米，20cm）

[Robot.chassis]
enabled = true # 底盘开关（车默认开）
port = "/dev/ttyUSB0"
baudrate = 115200
car_type = "X3Plus" # X3 / X3Plus / X1 / R2
forward_speed = 30 # 前进/后退档位（缺省 30）
turn_speed = 10    # 原地转向档位（缺省 10）

[Robot.lidar]
enabled = true # 雷达开关（含 SLAM 建图）
port = "/dev/ttyUSB1"
baudrate = 230400

[Robot.flight_ctrl]
enabled = false # 飞控开关（机，未来）
# connection = "/dev/ttyS0" # 飞控连接方式（MAVLink 串口/UDP，未来 task）
# baudrate = 921600 # 飞控串口波特率
vel_fwd = 0.3      # 前进/后退速度 m/s（缺省 0.3）
yaw_rate_deg = 15  # 转向角速度 °/s（缺省 15）
