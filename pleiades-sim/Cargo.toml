[package]
name = "pleiades-sim"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pleiades-sim"
path = "src/main.rs"

[dependencies]
# 共享底座（协议/集群/状态/世界/网络/事件总线）
pleiades-base = { path = "../pleiades-base", default-features = false }

# 异步运行时 + 同步原语
tokio = { version = "1", features = ["full"] }

# 日志
tracing = "0.1"

# DeviceHandler trait
async-trait = "0.1"

# 配置解析
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# 世界链路（task_31 §四.5.1）：WS 客户端
#   默认特性 = connect + handshake（客户端/服务端都有），默认**不含 TLS**；
#   绝不能写 default-features = false —— 那会把 connect_async / accept_async 一起关掉。
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde_json = "1.0"
# 取消令牌 CancellationToken（设计外唯一补充依赖，见 tmp/task31/plan.md R4：
#   pleiades-base 依赖 tokio-util 但不 re-export，sim 必须自己声明；lock 里已是 0.7.18，零下载）
# 注：本机 registry 的 tokio-util 0.7.18 **没有 `sync` feature**（lib.rs 里 `pub mod sync;`
#   是无条件编译），写 `features = ["sync"]` 会直接报 "does not have that feature"，
#   故按默认特性声明即可拿到 tokio_util::sync::CancellationToken。
tokio-util = "0.7"

# 设备能力注册（实现 base 的 DeviceCapability trait，版本须与 base 严格一致）
mlua = { version = "0.12.0-rc.1", features = ["lua54", "vendored", "async"] }
