[package]
name = "pleiades-uav"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pleiades-uav"
path = "src/main.rs"

[dependencies]
# 共享底座（协议/集群/状态/世界/网络/事件总线）
pleiades-base = { path = "../pleiades-base", default-features = false }

# 异步运行时 + 同步原语
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }

# 日志
tracing = "0.1"

# DeviceHandler trait
async-trait = "0.1"

# 设备配置解析
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"

# MAVLink 飞控协议（机设备端）
mavlink = { version = "0.18", default-features = false, features = ["std", "dialect-ardupilotmega", "dialect-common"] }

# 图像编码（NV12→RGB→JPEG，Task 29 阶段 1）
image = { version = "0.25", default-features = false, features = ["jpeg"] }

# 设备能力注册（实现 base 的 DeviceCapability trait，版本须与 base 严格一致）
mlua = { version = "0.12.0-rc.1", features = ["lua54", "vendored", "async"] }

# 摄像头抓帧（nokhwa 后端，平台条件：Linux V4L2 / Windows MediaFoundation）
[target.'cfg(target_os = "linux")'.dependencies]
nokhwa = { version = "0.10", default-features = false, features = ["input-v4l"] }

[target.'cfg(target_os = "windows")'.dependencies]
nokhwa = { version = "0.10", default-features = false, features = ["input-msmf"] }
